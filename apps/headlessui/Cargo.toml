[package]
name = "headlessui"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.15.1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }
tokio = "1.50.0"

[build-dependencies]
slint-build = "1.8.0"
