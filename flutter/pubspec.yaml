name: flutter_hbb
description: Your Remote Desktop Software

publish_to: "none" 

version: 1.4.4+62

environment:
  sdk: "^3.1.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.1
  external_path: ^1.0.3
  package_info_plus: ^4.2.0
  url_launcher: ^6.3.1
  url_launcher_ios: ^6.3.2
  http: ^1.1.0
  flutter_rust_bridge: "1.80.1"
  window_manager:
    git:
      url: https://github.com/rustdesk-org/window_manager

  freezed_annotation: ^2.0.3
  flutter_custom_cursor: ^0.0.4
  get: ^4.6.5
  uni_links:
    git:
      url: https://github.com/rustdesk-org/uni_links
      path: uni_links
      ref: f416118d843a7e9ed117c7bb7bdc2deda5a9e86f
  uni_links_desktop: ^0.1.6 # use 0.1.6 to make flutter 3.13 works
  path: ^1.8.1
  win32: any
  flutter_launcher_icons: ^0.13.1
  texture_rgba_renderer:
    git:
      url: https://github.com/rustdesk-org/flutter_texture_rgba_renderer
      ref: 42797e0f03141dc2b585f76c64a13974508058b4

  uuid: ^3.0.7

  device_info_plus: ^9.1.0
  sqflite: 2.2.0
  web_socket_channel: ^2.4.0

dev_dependencies:
  icons_launcher: ^2.0.4
  build_runner: ^2.4.6
  freezed: ^2.4.2
  flutter_lints: ^2.0.2
  ffigen: ^8.0.2

flutter_icons:
  image_path: "../res/icon.png"
  remove_alpha_ios: true
  android: true
  ios: true
  windows:
    generate: true
  macos:
    image_path: "../res/mac-icon.png"
    generate: true
  linux: true
  web:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/
